name: Lint

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
          extra-repositories: "https://mokymai.github.io/download/"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler, local::.
          needs: lint

      - name: Run lintr
        run: lintr::lint_package()
        shell: Rscript {0}

      - name: Check styler parse
        run: |
          styler::style_dir("R", strict = FALSE, dry = "fail")
          styler::style_dir("tests", strict = FALSE, dry = "fail")
        shell: Rscript {0}
