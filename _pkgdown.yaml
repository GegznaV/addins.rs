url: https://gegznav.github.io/addins.rs/
template:
  bootstrap: 5
  light-switch: true
  bootswatch: sandstone
  bootswatch_dark: darkly
  bslib:
    primary: "#1b4332"     # Deep Dark Green
    secondary: "#2d6a4f"   # Medium Sage
    success: "#52b788"     # Soft Emerald
    dark: "#2b2d42"        # Slate Dark
    light: "#f4f6f0"       # Off-white / Cream


# Search settings
search:
  backend: docsearch

# -------------------------------------------------------------------------
# Automatically switches, which verion should be built:
# released or in-development

development:
  mode: auto

